<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESix10 Community</title>

    <!-- Favicon & App Icons.  Generated by scripts/build-brand-assets.py -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA Meta -->
    <meta name="application-name" content="ESix10" />
    <meta name="apple-mobile-web-app-title" content="ESix10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Social / Open Graph -->
    <meta name="description" content="Faith-based community built on Ephesians 6:10. Brotherhood. Sisterhood. Family." />
    <meta property="og:site_name" content="ESix10 Community" />
    <meta property="og:title" content="ESix10 Community" />
    <meta property="og:description" content="Prepared. Equipped. Unshaken." />
    <!-- 1200x630 (1.91:1). Declaring the real dimensions stops platforms guessing
         and re-cropping, which is what squashed the old square logo on invites. -->
    <meta property="og:image" content="https://community.esix10.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ESix10 Initiative" />
    <meta property="og:url" content="https://community.esix10.com" />
    <meta property="og:type" content="website" />

    <!-- Without this, X/Twitter falls back to a small square card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ESix10 Community" />
    <meta name="twitter:description" content="Prepared. Equipped. Unshaken." />
    <meta name="twitter:image" content="https://community.esix10.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; background: #0a0a0a; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
